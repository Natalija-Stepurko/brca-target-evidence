name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pytest -q
      - name: The project page builds from the committed sources
        run: test ! -f docs/site/build.py || uv run --locked python docs/site/build.py
