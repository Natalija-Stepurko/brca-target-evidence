[project]
name = "brca-target-evidence"
version = "0.1.0"
description = "Does protein (and DNA) evidence pick better breast-cancer drug targets than RNA alone? A pre-registered evaluation against held-out dependency and clinical evidence, with popularity-matched nulls and an independent replication cohort."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lifelines>=0.29",
    "matplotlib>=3.9",
    "requests>=2.32",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# the MOFA+ arm
mofa = [
    "mofapy2>=0.7",
]

[project.scripts]
bte = "bte.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bte"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# a table of URLs and file names: long lines are the readable form
"src/bte/sources.py" = ["E501"]
